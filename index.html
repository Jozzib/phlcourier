<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Logistics Homepage</title>
<!-- Tailwind CSS via CDN for rapid styling -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
navy: {
900: '#0F172A',
950: '#090D16',
},
blue: {
600: '#2563EB',
}
}
}
}
}
</script>
</head>
<body class="bg-slate-50 font-sans text-slate-600 antialiased">

<!-- Sticky Navigation Bar -->
<nav class="sticky top-0 z-50 bg-navy-950/90 backdrop-blur-md border-b border-slate-800">
<div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-600/30">L</div>
<span class="text-white text-xl font-bold tracking-tight">LogiTech<span class="text-blue-600">Global</span></span>
</div>
<div class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
<a href="#" class="hover:text-white transition">Services</a>
<a href="#" class="hover:text-white transition">Global Network</a>
<a href="#" class="hover:text-white transition">Sustainability</a>
<a href="#" class="hover:text-white transition">Support</a>
</div>
<div>
<a href="#" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition shadow-lg shadow-blue-600/20">Client Portal</a>
</div>
</div>
</nav>

<!-- Hero Section with Tracking Widget -->
<header class="relative bg-gradient-to-br from-navy-950 via-navy-900 to-slate-900 text-white py-24 lg:py-32 overflow-hidden">
<!-- Abstract background geometric grid pattern -->
<div class="absolute inset-0 opacity-10 bg-[radial-gradient(#2563EB_1px,transparent_1px)] [background-size:20px_20px]"></div>

<div class="max-w-5xl mx-auto px-6 relative z-10 text-center">
<h1 class="text-4xl lg:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
Seamless Global Logistics, <br>
<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-blue-600">Engineered for Precision</span>
</h1>
<p class="text-lg lg:text-xl text-slate-300 max-w-2xl mx-auto mb-12">
Experience enterprise-grade shipping with real-time tracking, automated customs clearance, and absolute global reliability.
</p>

<!-- Floating Glassmorphism Tracking Widget -->
<div class="bg-white/10 backdrop-blur-xl p-4 sm:p-6 rounded-2xl border border-white/10 shadow-2xl max-w-3xl mx-auto">
<form class="flex flex-col sm:flex-row gap-3">
<div class="relative flex-grow">
<svg class="absolute left-4 top-3.5 h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
</svg>
<input type="text" placeholder="Enter tracking number(s)..." class="w-full bg-navy-900/80 text-white placeholder-slate-400 pl-12 pr-4 py-3.5 rounded-xl border border-slate-700 focus:outline-none focus:border-blue-500 text-sm">
</div>
<button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3.5 rounded-xl text-sm transition shadow-lg shadow-blue-600/30 flex items-center justify-center space-x-2">
<span>Track Shipment</span>
</button>
</form>
</div>
</div>
</header>

</body>
</html>
